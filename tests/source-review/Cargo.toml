[package]
name = "jait-source-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
autotests = false

[[test]]
name = "source_review"
path = "../contract/tests/source_review.rs"

[dependencies]
anyhow = { version = "=1.0.104" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
uuid = { version = "=1.28.0", features = ["v4"] }
hex = { version = "=0.4.3" }
sha2 = { version = "=0.10.9" }

[profile.dev]
debug = 0
