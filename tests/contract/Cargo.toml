[package]
name = "jait-contract"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "jait-contract"

[dependencies]
anyhow = "1.0"
ctrlc = { version = "3.5", features = ["termination"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[profile.dev]
debug = 0
