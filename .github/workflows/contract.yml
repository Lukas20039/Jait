name: Rust gateway contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Install gateway dependencies
        run: bun install --frozen-lockfile
      - name: Build gateway workspace dependencies
        run: |
          bun run --filter @jait/shared build
          bun run --filter @jait/screen-share build
      - name: Check Rust formatting and lint
        run: |
          bun run test:contract:fmt
          bun run test:contract:lint
      - name: Test contract parser and runner failure handling
        run: bun run test:contract:unit
      - name: Test the isolated TypeScript gateway from Rust
        run: bun run test:contract
      - name: Test TypeScript internals with Rust assertions
        run: bun run test:contract:internal
      - name: Audit source inventory and current parity evidence
        run: bun run test:contract:coverage --evidence-dir .jait/artifacts/contracts
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-contract-reports
          path: |
            .jait/artifacts/contracts/*/report.json
            .jait/artifacts/gateway-rust-readiness/coverage-audit.json
          if-no-files-found: warn
          retention-days: 7
